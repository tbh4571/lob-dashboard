# Single-container LOB Dashboard (UI + BFF on one port)
services:
  lob-dashboard:
    build: .
    image: lob-dashboard:latest
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      STATIC_DIR: /app/public
      # Optional extra CORS origins (comma-separated)
      # CORS_ORIGINS: https://dashboard.example.com
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
